services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: speckula
      POSTGRES_USER: speckula
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    volumes:
      - speckula_local_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speckula"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://speckula:${DB_PASSWORD:-localdev}@db:5432/speckula
      DIRECT_DATABASE_URL: postgresql://speckula:${DB_PASSWORD:-localdev}@db:5432/speckula
    depends_on:
      db:
        condition: service_healthy
    command: ./node_modules/.bin/prisma migrate deploy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://speckula:${DB_PASSWORD:-localdev}@db:5432/speckula
      DIRECT_DATABASE_URL: postgresql://speckula:${DB_PASSWORD:-localdev}@db:5432/speckula
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: gsk_test_00000000000000000000000000000000
      OPENAI_API_KEY: ""
      FIREBASE_PROJECT_ID: buildcase-f103a
      FIREBASE_CLIENT_EMAIL: service-account@buildcase-f103a.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY_B64: ZHVtbXktbG9jYWwtZmlyZWJhc2Uta2V5
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URLS: http://localhost:3000
      AI_CACHE_TTL_MINUTES: 60
      DAILY_TOKEN_QUOTA: 200000
      SENTRY_DSN: ""
      METRICS_TOKEN: local-dev-token-please-change
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: ""
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: node dist/index.js

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://speckula:${DB_PASSWORD:-localdev}@db:5432/speckula
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: gsk_test_00000000000000000000000000000000
      OPENAI_API_KEY: ""
      FIREBASE_PROJECT_ID: buildcase-f103a
      FIREBASE_CLIENT_EMAIL: service-account@buildcase-f103a.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY_B64: ZHVtbXktbG9jYWwtZmlyZWJhc2Uta2V5
      ANALYSIS_WORKER_CONCURRENCY: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: node dist/workers/analysisWorker.js

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyCcsoBP-eGX1T0qYEmOZOnWJ1V-3ybclAY"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "buildcase-f103a.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "buildcase-f103a"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "buildcase-f103a.firebasestorage.app"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "111488964856"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:111488964856:web:35768ec62c44b26393430d"
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-V3Q757DFFQ"
        NEXT_PUBLIC_SENTRY_DSN: ""
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_SENTRY_DSN: ""
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  speckula_local_pg:
